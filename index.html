d;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:19px}.stat{padding:21px}.stat .value{font-size:28px;font-weight:800;letter-spacing:-1px;margin:7px 0 3px;overflow-wrap:anywhere}.stat .caption{font-size:12px;color:var(--muted)}.positive{color:#307c58}.negative{color:var(--red)}.content-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel{padding:21px;margin-bottom:18px}.panel h3{margin:0 0 15px;font-size:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.section-head h3{margin:0}.progress{height:11px;background:#ecf0e9;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#7cad8c;transition:width .2s}.account-row,.bill-row,.transfer-row{padding:13px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.account-row:last-child,.bill-row:last-child,.transfer-row:last-child{border-bottom:0}.bubble{height:40px;width:40px;border-radius:13px;background:#e7f1e5;display:grid;place-items:center;font-size:19px;flex:none}.grow{flex:1;min-width:0}.name{font-weight:730}.sub{font-size:12px;color:var(--muted)}.amount{font-weight:750;white-space:nowrap}.pill{padding:4px 9px;font-size:12px;border-radius:99px;background:#ecf3e9;color:#42765e;white-space:nowrap}.pill.due{background:#ffedf0;color:#aa4357}.pill.paid{background:#e2f2e5;color:#2d754b}.text-btn{background:transparent;border:0;color:var(--accent);font-weight:750;padding:4px 6px}.tiny-btn{background:white;border:1px solid var(--line);border-radius:9px;padding:6px 9px}.check{width:22px;height:22px;accent-color:#4b8e68;flex:none}.bill-group{margin-bottom:14px;border:1px solid var(--line);border-radius:15px;overflow:hidden}.bill-group-head{background:#f5f7f1;padding:13px 15px;display:flex;align-items:center;gap:9px}.bill-group .bill-row{padding:12px 14px}.bill-group .bill-row:last-child{border-bottom:0}.bill-group .name{font-size:14px}.bill-group .sub{line-height:1.5}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.account-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.account-card-head{display:flex;align-items:center;gap:12px}.account-card .money{font-size:27px;font-weight:800;margin-top:15px}.account-card .account-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.empty{text-align:center;color:var(--muted);padding:32px 10px}.hint{background:#fff6e2;border:1px solid #f3e5bd;border-radius:13px;padding:12px 15px;color:#715d36;font-size:13px;margin:12px 0 18px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}.tag{font-size:11px;border-radius:7px;background:#eaf1e7;padding:3px 7px;color:#47705b}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:620px}th{font-size:12px;color:var(--muted);font-weight:650;background:#f5f7f3}td,th{padding:12px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}td button{white-space:nowrap}.modal-backdrop{position:fixed;inset:0;z-index:10;background:#17271d88;display:grid;place-items:center;padding:20px}.modal{width:min(100%,520px);max-height:92vh;overflow:auto;background:#fffefa;border-radius:22px;padding:26px;box-shadow:0 18px 70px #0003}.modal h2{margin:0 0 17px}.field{margin:0 0 14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #d5dfd6;border-radius:10px;padding:11px;background:#fff;color:var(--ink)}.field input:focus,.field select:focus{outline:2px solid #a8cbb5}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small-note{font-size:12px;color:var(--muted);line-height:1.6}.footer{text-align:center;margin:30px 0;color:var(--muted);font-size:12px}.hide{display:none!important} @media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.content-grid,.two-col{grid-template-columns:1fr}.wrap{padding:15px 13px 30px}.hero{padding:19px}.stat{padding:15px}.stat .value{font-size:23px}.panel{padding:15px}.brand h1{font-size:23px}}@media(max-width:420px){.stats{gap:9px}.stat .value{font-size:20px}.btn{padding:9px 10px}.form-grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="header"><div class="brand"><div class="brandmark">🌷</div><div><h1>little ledger</h1><div class="muted small">your money, a little more organized ♡</div></div></div><div class="actions"><button class="btn" id="exportBtn">↓ Backup data</button><button class="btn" id="importBtn">↑ Restore backup</button><input class="hide" id="importFile" type="file" accept="application/json,.json"></div></header><nav class="nav" id="nav"><button data-tab="overview" class="active">✿ Overview</button><button data-tab="bills">☑ Bills checklist</button><button data-tab="accounts">🏦 Bank accounts</button><button data-tab="payday">💸 Payday plan</button><button data-tab="activity">↗ Activity</button></nav><main id="app"></main><footer class="footer">Browser-based tracker • Data stays in this browser only (no cross-device sync) • No real bank payments are made</footer></div><div id="modalRoot"></div><script>
'use strict';
const KEY='little-ledger-v2';
const initial={version:1,paycheck:2185.41,accounts:[
{id:'billpay',name:'Home Bills',bank:'ABB / bill-pay account',balance:null,icon:'🏠'},
{id:'car',name:'Car',bank:'SouthState',balance:null,icon:'🚙'},

{id:'subs',name:'Subscriptions',bank:'Capital One',balance:null,icon:'📱'},
{id:'groceries',name:'Groceries',bank:'ABB',balance:null,icon:'🛒'}],bills:[
{id:'rent',name:'Rent',accountId:'billpay',amount:1027.98,perCheck:513.99,dueDay:1,active:true,notes:'Fixed $513.99 every biweekly paycheck, regardless of due date'},
{id:'electric',name:'Electric',accountId:'billpay',amount:115,perCheck:57.5,dueDay:17,active:true,notes:'Santee Cooper; amount may vary'},
{id:'wifi',name:'Wi-Fi',accountId:'billpay',amount:68,perCheck:34,dueDay:1,active:true,notes:'HTC'},
{id:'phone',name:'Phone',accountId:'billpay',amount:88,perCheck:44,dueDay:22,active:true,notes:'AT&T'},
{id:'ruth',name:'Other',accountId:'billpay',amount:0,perCheck:0,dueDay:null,active:false,notes:'Inactive placeholder; no current payday allocation'},
{id:'carpayment',name:'Car payment',accountId:'car',amount:123,perCheck:61.5,dueDay:null,active:true,notes:'Worksheet printed $122/month; $123 matches $61.50/check; verify'},
{id:'carinsurance',name:'Car insurance',accountId:'car',amount:172,perCheck:86,dueDay:null,active:true,notes:'Farm Bureau'},
{id:'fuel',name:'Gas',accountId:'gas',amount:100,perCheck:50,dueDay:null,active:true,notes:'Spending allocation'},
{id:'fun',name:'General entertainment',accountId:'spend',amount:250,perCheck:125,dueDay:null,active:true,notes:'Spending allocation'},
{id:'pilates',name:'Pilates',accountId:'spend',amount:145,perCheck:72.5,dueDay:8,active:false,notes:'Crossed out on handwritten worksheet; inactive'},
{id:'capitalone',name:'Capital One minimum',accountId:'cards',amount:80,perCheck:40,dueDay:27,active:true,notes:'Credit card minimum'},
{id:'discover',name:'Discover minimum',accountId:'cards',amount:76,perCheck:38,dueDay:1,active:true,notes:'Credit card minimum'},
{id:'wells',name:'Wells Fargo minimum',accountId:'cards',amount:222,perCheck:111,dueDay:4,active:true,notes:'Credit card minimum'},
{id:'efund',name:'Emergency fund',accountId:'emergency',amount:200,perCheck:100,dueDay:null,active:true,notes:'Savings transfer; not a bill'},
{id:'pet',name:'Ralphie fund',accountId:'ralphie',amount:100,perCheck:50,dueDay:null,active:true,notes:'Pet savings allocation'},
{id:'icloud',name:'iCloud',accountId:'subs',amount:3,perCheck:1.5,dueDay:13,active:true,notes:''},
{id:'appleone',name:'Apple One',accountId:'subs',amount:22,perCheck:11,dueDay:3,active:true,notes:'Handwritten $25 may be updated amount; verify'},
{id:'snap',name:'Snapchat',accountId:'subs',amount:5,perCheck:2.5,dueDay:9,active:true,notes:''},
{id:'audible',name:'Audible',accountId:'subs',amount:15,perCheck:7.5,dueDay:28,active:true,notes:''},
{id:'disney',name:'Disney+',accountId:'subs',amount:36,perCheck:18,dueDay:7,active:true,notes:''},
{id:'netflix',name:'Netflix',accountId:'subs',amount:30,perCheck:15,dueDay:27,active:true,notes:''},
{id:'amazon',name:'Amazon',accountId:'subs',amount:12,perCheck:6,dueDay:null,active:true,notes:'Worksheet says April; verify billing cycle'},
{id:'food',name:'Groceries',accountId:'groceries',amount:250,perCheck:125,dueDay:null,active:true,notes:'Spending allocation'}],payments:[],transactions:[]};
const clone=x=>JSON.parse(JSON.stringify(x));let data;try{data=JSON.parse(localStorage.getItem(KEY))||clone(initial)}catch(e){data=clone(initial)};
// Rename the existing envelope label without changing its ID or saved allocations.
if(Array.isArray(data.bills)){for(const bill of data.bills){if(bill.id==='ruth'){bill.name='Other';bill.amount=0;bill.perCheck=0;bill.active=false;bill.notes='Inactive placeholder; no current payday allocation';}}}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Could not save. Your browser storage may be full or disabled. Export a backup.')}};
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const today=()=>new Date().toISOString().slice(0,10);const monthKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;let month=new Date();month.setDate(1);let tab='payday';const paid=(billId,key=monthKey(month))=>data.payments.find(p=>p.billId===billId&&p.month===key);const account=id=>data.accounts.find(a=>a.id===id);const active=()=>data.bills.filter(b=>b.active);const funded=b=>Number(b.perCheck)||0;const totalPerCheck=()=>active().reduce((a,b)=>a+funded(b),0);const dueLabel=b=>b.dueDay?`Due ${ordinal(b.dueDay)}`:'No date set';function ordinal(n){return n+(n%100>=11&&n%100<=13?'th':n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th')}function balance(a){if(a.balance===null||a.balance===undefined||a.balance==='')return null;return Number(a.balance)+data.transactions.filter(t=>t.accountId===a.id).reduce((sum,t)=>sum+Number(t.amount),0)}const finished=()=>active().filter(b=>paid(b.id));const payTotal=()=>finished().reduce((s,b)=>s+(paid(b.id).amount||0),0);const sumMonthly=()=>active().reduce((s,b)=>s+(Number(b.amount)||0),0);const displayMonth=()=>month.toLocaleString('en-US',{month:'long',year:'numeric'});const stat=(label,value,desc,cl='')=>`<div class="stat"><div class="muted small">${label}</div><div class="value ${cl}">${value}</div><div class="caption">${desc}</div></div>`;const icon=a=>esc(a?.icon||'🏦');const navigate=t=>{tab=t;render();window.scrollTo({top:0,behavior:'smooth'})};
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('app').innerHTML=({overview:renderOverview,bills:renderBills,accounts:renderAccounts,payday:renderPayday,activity:renderActivity}[tab])();const x=document.getElementById('nextPayday');if(x){const anchor=new Date(2026,10,20,12),now=new Date();while(anchor<new Date(now.getFullYear(),now.getMonth(),now.getDate()))anchor.setDate(anchor.getDate()+14);x.textContent=anchor.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}}
function monthHeader(title,subtitle){return `<div class="hero"><div><div class="small" style="font-weight:800;letter-spacing:.11em;color:#668874">MY MONEY PLANNER</div><h2>${title}</h2><p>${subtitle}</p></div><div class="month"><button onclick="shiftMonth(-1)" aria-label="Previous month">‹</button><strong>${displayMonth()}</strong><button onclick="shiftMonth(1)" aria-label="Next month">›</button></div></div>`}function shiftMonth(d){month.setMonth(month.getMonth()+d);render()}
function renderOverview(){const checklist=active(),done=finished().length,acctBalances=data.accounts.map(balance),known=acctBalances.filter(v=>v!==null),total=known.reduce((s,v)=>s+v,0);return monthHeader('your money, at a glance ✨','Everything you need to check, all in one cozy place.')+`<div class="stats">${stat('Paycheck',money(data.paycheck),'Editable in Payday plan')}${stat('Set aside / paycheck',money(totalPerCheck()),'Your active recurring allocations')}${stat('Left after allocations',money(data.paycheck-totalPerCheck()),'Before any unlisted expenses',data.paycheck-totalPerCheck()<0?'negative':'positive')}${stat('Bills / allocations completed',`${done} / ${checklist.length}`,`For ${displayMonth()}`)}</div><div class="content-grid"><div><div class="panel"><div class="section-head"><h3>☑ Monthly checklist</h3><button class="text-btn" onclick="navigate('bills')">View all →</button></div><div class="progress"><span style="width:${checklist.length?done/checklist.length*100:0}%"></span></div><p class="sub" style="margin:9px 0 13px">${done} of ${checklist.length} marked complete this month</p>${checklist.filter(b=>!paid(b.id)).sort((a,b)=>(a.dueDay||99)-(b.dueDay||99)).slice(0,7).map(b=>billRow(b)).join('')||'<div class="empty">All done for this month! 🌷</div>'}</div><div class="panel"><div class="section-head"><h3>🏦 Your accounts</h3><button class="text-btn" onclick="navigate('accounts')">View all →</button></div>${data.accounts.map(a=>`<div class="account-row"><div class="bubble">${icon(a)}</div><div class="grow"><div class="name">${esc(a.name)}</div><div class="sub">${esc(a.bank)}</div></div><div class="amount">${balance(a)===null?'—':money(balance(a))}</div></div>`).join('')}</div></div><div><div class="panel"><h3>🌼 Payday snapshot</h3><div class="small muted">Per paycheck • based on your worksheet</div><div style="font-size:34px;font-weight:850;margin:8px 0">${money(data.paycheck-totalPerCheck())}</div><div class="sub">Not yet allocated</div><div class="progress" style="margin:18px 0"><span style="width:${Math.min(100,100*totalPerCheck()/Math.max(1,data.paycheck))}%"></span></div>${data.accounts.map(a=>{const v=active().filter(b=>b.accountId===a.id).reduce((s,b)=>s+funded(b),0);return v?`<div class="account-row"><span>${icon(a)}</span><div class="grow name">${esc(a.name)}</div><span class="amount">${money(v)}</span></div>`:''}).join('')}<button class="btn primary" style="margin-top:17px;width:100%" onclick="navigate('payday')">Open payday plan</button></div><div class="panel"><h3>💡 A little reminder</h3><p class="muted" style="margin:0">Balances are updated when you record payments, deposits, or transfers. This version doesn't connect to banks or send payments automatically.</p>${known.length?`<p class="small muted">${known.length} of ${data.accounts.length} balances entered • combined tracked balance: <strong>${money(total)}</strong></p>`:'<p class="small muted">Start by entering your current balances in Bank accounts.</p>'}</div></div></div>`}
function billRow(b){const a=account(b.accountId),p=paid(b.id);return `<div class="bill-row"><input class="check" type="checkbox" ${p?'checked':''} onchange="togglePaid('${esc(b.id)}',this.checked)" aria-label="Mark ${esc(b.name)} complete"><div class="grow"><div class="name">${esc(b.name)}</div><div class="sub">${esc(a?.name||'Unassigned')} · ${dueLabel(b)}</div></div><div style="text-align:right"><div class="amount">${money(p?p.amount:b.amount)}</div><div class="pill ${p?'paid':b.dueDay?'due':''}">${p?'Completed':b.dueDay?'Upcoming':'Allocated'}</div></div></div>`}
function renderBills(){return monthHeader('your bill checklist ☑','Grouped by the account each payment comes from.')+`<div class="toolbar"><div class="muted">${finished().length} of ${active().length} completed · ${money(payTotal())} recorded this month</div><button class="btn primary" onclick="editBill()">+ Add a bill</button></div>${data.accounts.map(a=>{const bills=data.bills.filter(b=>b.accountId===a.id&&b.active);if(!bills.length)return '';return `<div class="bill-group"><div class="bill-group-head"><span>${icon(a)}</span><div class="grow"><strong>${esc(a.name)}</strong><div class="sub">${esc(a.bank)} · ${bills.filter(b=>paid(b.id)).length}/${bills.length} done</div></div><strong>${money(bills.reduce((s,b)=>s+Number(b.amount),0))}/mo</strong></div>${bills.map(b=>`<div class="bill-row"><input class="check" type="checkbox" ${paid(b.id)?'checked':''} onchange="togglePaid('${esc(b.id)}',this.checked)" aria-label="Mark ${esc(b.name)} complete"><div class="grow"><div class="name">${esc(b.name)}</div><div class="sub">${dueLabel(b)} · ${money(b.perCheck)}/paycheck${b.notes?' · '+esc(b.notes):''}</div></div><div class="amount">${money(paid(b.id)?.amount??b.amount)}</div><button class="tiny-btn" onclick="editBill('${esc(b.id)}')">Edit</button></div>`).join('')}</div>`}).join('')}<div class="panel"><div class="section-head"><h3>Paused bills</h3></div>${data.bills.filter(b=>!b.active).map(b=>`<div class="bill-row"><div class="grow"><strong>${esc(b.name)}</strong><div class="sub">${esc(account(b.accountId)?.name||'Unassigned')}</div></div><button class="tiny-btn" onclick="editBill('${esc(b.id)}')">Edit / reactivate</button></div>`).join('')||'<div class="sub">None</div>'}</div>`}
function renderAccounts(){return `<div class="hero"><div><div class="small" style="font-weight:800;letter-spacing:.11em">YOUR BANKING BUCKETS</div><h2>all your accounts 🏦</h2><p>Track current balances and money moving between accounts.</p></div><button class="btn primary" onclick="editAccount()">+ Add account</button></div><div class="hint">🔒 Only use nicknames for accounts. Never enter account numbers, passwords, or routing numbers. Enter a starting balance once; future transactions adjust the tracked balance.</div><div class="two-col">${data.accounts.map(a=>`<div class="account-card"><div class="account-card-head"><div class="bubble">${icon(a)}</div><div class="grow"><div class="name">${esc(a.name)}</div><div class="sub">${esc(a.bank)}</div></div></div><div class="money ${balance(a)!==null&&balance(a)<0?'negative':''}">${balance(a)===null?'Not set':money(balance(a))}</div><div class="small muted">Tracked balance</div><div class="account-actions"><button class="tiny-btn" onclick="editAccount('${esc(a.id)}')">Edit / set balance</button><button class="tiny-btn" onclick="addTransaction('${esc(a.id)}')">+ Deposit / expense</button></div></div>`).join('')}</div><div class="panel" style="margin-top:18px"><div class="section-head"><h3>Move money between accounts</h3><button class="btn primary" onclick="transfer()">+ Record a transfer</button></div><p class="muted small">A recorded transfer deducts from one account and adds to another. It does not move money at your actual bank.</p></div>`}
function renderPayday(){const alloc=totalPerCheck();return `<div class="hero"><div><div class="small" style="font-weight:800;letter-spacing:.11em">EVERY TWO WEEKS</div><h2>payday plan 💸</h2><p>How much you plan to put into each account when you get paid.</p></div><button class="btn primary" onclick="editPaycheck()">Edit paycheck</button></div><div class="stats">${stat('Net paycheck',money(data.paycheck),'You can change this')}${stat('Total planned',money(alloc),'Active bills & savings')}${stat('Unallocated',money(data.paycheck-alloc),'Before unlisted spending',data.paycheck-alloc<0?'negative':'positive')}${stat('Monthly planned',money(sumMonthly()),'Based on entered monthly amounts')}</div><div class="panel"><h3>Transfers & set-asides per paycheck</h3><div class="small-note">Your account balances are never deducted from these allocations. These are targets, not real transfers. Use “Record transfer” only after moving money in your bank app.</div><div class="hint">📅 Next scheduled payday: <strong id="nextPayday">November 20, 2026</strong> · every 14 days. Your actual pay date may shift around bank holidays.</div>${data.accounts.map(a=>{const bills=active().filter(b=>b.accountId===a.id),sum=bills.reduce((s,b)=>s+funded(b),0);return bills.length?`<div class="account-row"><div class="bubble">${icon(a)}</div><div class="grow"><div class="name">${esc(a.name)}</div><div class="sub">${bills.map(b=>esc(b.name)).join(' · ')}</div></div><div class="amount">${money(sum)}</div><button class="tiny-btn" onclick="transfer(null,'${esc(a.id)}','${sum.toFixed(2)}')">Record</button></div>`:''}).join('')}<p class="small-note">Paydays repeat every 14 days starting November 20, 2026. Each payday uses your per-paycheck allocations, independent of due dates and any account balances. Three-paycheck months retain the same fixed allocations.</p></div>`}
function renderActivity(){const tx=[...data.transactions].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="hero"><div><h2>money activity ✨</h2><p>Every payment, deposit, expense, and recorded transfer.</p></div><button class="btn primary" onclick="addTransaction()">+ Record activity</button></div><div class="panel"><div class="section-head"><h3>Transaction history</h3><span class="small muted">${tx.length} entries</span></div>${tx.length?`<div class="table-scroll"><table><thead><tr><th>Date</th><th>Account</th><th>Description</th><th>Amount</th><th></th></tr></thead><tbody>${tx.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(account(t.accountId)?.name||'Removed account')}</td><td>${esc(t.note)}</td><td class="${t.amount<0?'negative':'positive'}">${t.amount<0?'-':'+'}${money(Math.abs(t.amount))}</td><td><button class="tiny-btn" onclick="deleteTransaction('${esc(t.id)}')">Undo</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No transactions yet. Enter your beginning balances, then record deposits, payments, and transfers.</div>'}</div><div class="hint">Undoing a bill payment transaction will not uncheck the bill automatically. Uncheck that bill on the checklist as well if needed.</div>`}
function openModal(title,fields,onsubmit,extra=''){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><h2>${title}</h2><form id="modalForm">${fields}<div class="form-actions">${extra}<button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save</button></div></form></div></div>`;document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();onsubmit(new FormData(e.currentTarget))};const first=root.querySelector('input:not([type=hidden]), select');if(first)first.focus()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}const field=(label,name,value='',type='text',attr='')=>`<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${attr}></div>`;const selectField=(label,name,options,selected)=>`<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
function editPaycheck(){openModal('Edit your paycheck',field('Take-home paycheck amount','paycheck',data.paycheck,'number','min="0" step="0.01" required'),f=>{data.paycheck=Number(f.get('paycheck'));persist();closeModal();render()})}
function editAccount(accountId){const a=account(accountId),curr=a?balance(a):null;openModal(a?'Edit account':'Add an account',field('Account nickname','name',a?.name||'','text','required maxlength="60"')+field('Bank name / label (no account numbers)','bank',a?.bank||'')+field('Emoji (optional)','icon',a?.icon||'🏦')+field('Current tracked balance (leave blank if unknown)','balance',curr===null?'':curr,'number','step="0.01"')+`<p class="small-note">Editing this balance resets the starting point so your tracked total equals the number entered now, while keeping history.</p>`,f=>{const newBal=f.get('balance')===''?null:Number(f.get('balance'));if(a){a.name=f.get('name');a.bank=f.get('bank');a.icon=f.get('icon');const effects=data.transactions.filter(t=>t.accountId===a.id).reduce((s,t)=>s+Number(t.amount),0);a.balance=newBal===null?null:newBal-effects}else data.accounts.push({id:id(),name:f.get('name'),bank:f.get('bank'),icon:f.get('icon'),balance:newBal});persist();closeModal();render()})}
function editBill(billId){const b=data.bills.find(b=>b.id===billId);openModal(b?'Edit bill or allocation':'Add bill or allocation',field('Name','name',b?.name||'','text','required')+selectField('Paid from account','accountId',data.accounts.map(a=>[a.id,`${a.name} (${a.bank})`]),b?.accountId)+`<div class="form-grid">${field('Monthly amount ($)','amount',b?.amount??'','number','min="0" step="0.01" required')}${field('Set aside each paycheck ($)','perCheck',b?.perCheck??'','number','min="0" step="0.01" required')}</div>`+field('Due day (1–31, optional)','dueDay',b?.dueDay??'','number','min="1" max="31"')+field('Notes','notes',b?.notes||'')+selectField('Status','active',[['yes','Active'],['no','Paused / canceled']],b?.active===false?'no':'yes'),f=>{const obj={id:b?.id||id(),name:f.get('name'),accountId:f.get('accountId'),amount:Number(f.get('amount')),perCheck:Number(f.get('perCheck')),dueDay:f.get('dueDay')?Number(f.get('dueDay')):null,notes:f.get('notes'),active:f.get('active')==='yes'};if(b)Object.assign(b,obj);else data.bills.push(obj);persist();closeModal();render()},b?`<button type="button" class="btn danger" style="margin-right:auto" onclick="deleteBill('${esc(b.id)}')">Delete</button>`:'')}
function deleteBill(billId){if(!confirm('Delete this bill? Existing payment history will also be removed.'))return;data.bills=data.bills.filter(b=>b.id!==billId);data.payments=data.payments.filter(p=>p.billId!==billId);data.transactions=data.transactions.filter(t=>t.billId!==billId);persist();closeModal();render()}
function togglePaid(billId,checked){const b=data.bills.find(x=>x.id===billId);if(!b)return;const key=monthKey(month);if(checked){openModal('Mark '+esc(b.name)+' complete',field('Actual amount ($)','amount',b.amount,'number','min="0" step="0.01" required')+field('Date paid / moved','date',today(),'date','required')+`<p class="small-note">This records the payment in this month's checklist. If you have entered a balance for ${esc(account(b.accountId)?.name)}, it will also deduct the amount from that tracked account. For savings or spending allocations, only mark complete when money has actually moved or been spent.</p>`,f=>{const amount=Number(f.get('amount')),date=f.get('date'),p={id:id(),billId:b.id,month:key,amount,date};data.payments.push(p);data.transactions.push({id:id(),accountId:b.accountId,amount:-amount,date,note:`${b.name} — ${key}`,billId:b.id,paymentId:p.id});persist();closeModal();render()})}else{const p=paid(billId,key);if(p){data.payments=data.payments.filter(x=>x.id!==p.id);data.transactions=data.transactions.filter(t=>t.paymentId!==p.id)}persist();render()}}
function addTransaction(accountId){openModal('Record deposit or expense',selectField('Account','accountId',data.accounts.map(a=>[a.id,a.name]),accountId||data.accounts[0]?.id)+selectField('Type','kind',[['in','Money in / deposit'],['out','Money out / expense']],'in')+field('Amount ($)','amount','','number','min="0.01" step="0.01" required')+field('Date','date',today(),'date','required')+field('Description','note','','text','required'),f=>{const amt=Number(f.get('amount'));data.transactions.push({id:id(),accountId:f.get('accountId'),amount:f.get('kind')==='in'?amt:-amt,date:f.get('date'),note:f.get('note')});persist();closeModal();render()})}
function transfer(from,to,amount){if(data.accounts.length<2)return alert('Add at least two accounts first.');openModal('Record an account transfer',selectField('From account','from',data.accounts.map(a=>[a.id,a.name]),from||data.accounts[0].id)+selectField('To account','to',data.accounts.map(a=>[a.id,a.name]),to||data.accounts[1].id)+field('Amount ($)','amount',amount||'','number','min="0.01" step="0.01" required')+field('Date','date',today(),'date','required')+field('Description','note','Payday transfer'),f=>{if(f.get('from')===f.get('to'))return alert('Choose two different accounts.');const group=id(),amt=Number(f.get('amount')),date=f.get('date'),note=f.get('note');data.transactions.push({id:id(),group,accountId:f.get('from'),amount:-amt,date,note:`Transfer to ${account(f.get('to')).name}: ${note}`},{id:id(),group,accountId:f.get('to'),amount:amt,date,note:`Transfer from ${account(f.get('from')).name}: ${note}`});persist();closeModal();render()})}
function deleteTransaction(txId){const t=data.transactions.find(t=>t.id===txId);if(!t||!confirm('Undo this transaction'+(t.group?' and both sides of its transfer':'')+'?'))return;if(t.paymentId){data.payments=data.payments.filter(p=>p.id!==t.paymentId)}data.transactions=data.transactions.filter(x=>x.id!==txId&&(!t.group||x.group!==t.group));persist();render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)navigate(b.dataset.tab)});document.getElementById('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'little-ledger',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`little-ledger-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text()),d=obj.data||obj;if(!Array.isArray(d.accounts)||!Array.isArray(d.bills)||!Array.isArray(d.payments)||!Array.isArray(d.transactions)||typeof d.paycheck!=='number')throw Error('Not a Little Ledger backup');if(confirm('Replace ALL current data on this device with this backup?')){data=d;persist();render();alert('Backup restored successfully.')}}catch(err){alert('Could not restore: '+err.message)}e.target.value=''};render();
</script></body></html>
