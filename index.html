d;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:19px}.stat{padding:21px}.stat .value{font-size:28px;font-weight:800;letter-spacing:-1px;margin:7px 0 3px;overflow-wrap:anywhere}.stat .caption{font-size:12px;color:var(--muted)}.positive{color:#307c58}.negative{color:var(--red)}.content-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel{padding:21px;margin-bottom:18px}.panel h3{margin:0 0 15px;font-size:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.section-head h3{margin:0}.progress{height:11px;background:#ecf0e9;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#7cad8c;transition:width .2s}.account-row,.bill-row,.transfer-row{padding:13px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.account-row:last-child,.bill-row:last-child,.transfer-row:last-child{border-bottom:0}.bubble{height:40px;width:40px;border-radius:13px;background:#e7f1e5;display:grid;place-items:center;font-size:19px;flex:none}.grow{flex:1;min-width:0}.name{font-weight:730}.sub{font-size:12px;color:var(--muted)}.amount{font-weight:750;white-space:nowrap}.pill{padding:4px 9px;font-size:12px;border-radius:99px;background:#ecf3e9;color:#42765e;white-space:nowrap}.pill.due{background:#ffedf0;color:#aa4357}.pill.paid{background:#e2f2e5;color:#2d754b}.text-btn{background:transparent;border:0;color:var(--accent);font-weight:750;padding:4px 6px}.tiny-btn{background:white;border:1px solid var(--line);border-radius:9px;padding:6px 9px}.check{width:22px;height:22px;accent-color:#4b8e68;flex:none}.bill-group{margin-bottom:14px;border:1px solid var(--line);border-radius:15px;overflow:hidden}.bill-group-head{background:#f5f7f1;padding:13px 15px;display:flex;align-items:center;gap:9px}.bill-group .bill-row{padding:12px 14px}.bill-group .bill-row:last-child{border-bottom:0}.bill-group .name{font-size:14px}.bill-group .sub{line-height:1.5}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.account-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.account-card-head{display:flex;align-items:center;gap:12px}.account-card .money{font-size:27px;font-weight:800;margin-top:15px}.account-card .account-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.empty{text-align:center;color:var(--muted);padding:32px 10px}.hint{background:#fff6e2;border:1px solid #f3e5bd;border-radius:13px;padding:12px 15px;color:#715d36;font-size:13px;margin:12px 0 18px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}.tag{font-size:11px;border-radius:7px;background:#eaf1e7;padding:3px 7px;color:#47705b}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:620px}th{font-size:12px;color:var(--muted);font-weight:650;background:#f5f7f3}td,th{padding:12px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}td button{white-space:nowrap}.modal-backdrop{position:fixed;inset:0;z-index:10;background:#17271d88;display:grid;place-items:center;padding:20px}.modal{width:min(100%,520px);max-height:92vh;overflow:auto;background:#fffefa;border-radius:22px;padding:26px;box-shadow:0 18px 70px #0003}.modal h2{margin:0 0 17px}.field{margin:0 0 14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #d5dfd6;border-radius:10px;padding:11px;background:#fff;color:var(--ink)}.field input:focus,.field select:focus{outline:2px solid #a8cbb5}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small-note{font-size:12px;color:var(--muted);line-height:1.6}.footer{text-align:center;margin:30px 0;color:var(--muted);font-size:12px}.hide{display:none </style></head><body><div id="cloudGate" class="cloud-gate"><div class="cloud-card"><h2>🌷 Little Ledger</h2><p>Connecting to your private cloud ledger…</p></div></div><div class="wrap" id="appShell" hidden><div id="cloudBanner" class="cloud-banner"><span id="cloudStatus">Cloud sync</span><button type="button" class="btn" id="signOutBtn">Sign out</button></div><header class="header"><div class="brand"><div class="brandmark">🌷</div><div><h1>little ledger</h1><div class="muted small">your money, a little more organized ♡</div></div></div><div class="actions"><button class="btn" id="exportBtn">↓ Backup data</button><button class="btn" id="importBtn">↑ Restore backup</button><input class="hide" id="importFile" type="file" accept="application/json,.json"></div></header><nav class="nav" id="nav"><button data-tab="overview">✿ Overview</button><button data-tab="bills" class="active">☑ Bills checklist</button><button data-tab="payday">💸 Payday plan</button><button data-tab="activity">↗ Activity</button><button data-tab="accounts">🏦 Bank accounts</button></nav><main id="app"></main><footer class="footer">Browser-based tracker • Data stays in this browser only (no cross-device sync) • No real bank payments are made</footer></div><div id="modalRoot"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>

const cloudClient=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

const initial={version:1,paycheck:0,accounts:[
{id:'home',name:'Housing & Utilities',bank:'Your bank',balance:null,icon:'🏠'},
{id:'transport',name:'Transportation',bank:'Your bank',balance:null,icon:'🚗'},
{id:'everyday',name:'Everyday Spending',bank:'Your bank',balance:null,icon:'🛒'},

],bills:[
{id:'example-rent',name:'Rent / Mortgage',accountId:'home',amount:1200,perCheck:600,dueDay:1,active:true,notes:'Example only — replace with your own amount.'},
{id:'example-electric',name:'Electricity',accountId:'home',amount:120,perCheck:60,dueDay:15,active:true,notes:'Example estimate; utilities may vary.'},
{id:'example-water',name:'Water',accountId:'home',amount:40,perCheck:20,dueDay:20,active:true,notes:'Example estimate.'},
{id:'example-internet',name:'Internet',accountId:'home',amount:65,perCheck:32.5,dueDay:10,active:true,notes:'Example estimate.'},
{id:'example-phone',name:'Phone',accountId:'home',amount:60,perCheck:30,dueDay:18,active:true,notes:'Example estimate.'},
{id:'example-auto-insurance',name:'Car Insurance',accountId:'transport',amount:130,perCheck:65,dueDay:12,active:true,notes:'Example estimate.'},
{id:'example-fuel',name:'Fuel / Transit',accountId:'transport',amount:160,perCheck:80,dueDay:null,active:true,notes:'Example spending allocation.'},

{id:'example-emergency',name:'Emergency Savings',accountId:'savings',amount:100,perCheck:50,dueDay:null,active:true,notes:'Example savings allocation, not a bill.'}
],payments:[],reviews:[],transactions:[]};
const clone=x=>JSON.parse(JSON.stringify(x));let data;try{data=JSON.parse(localStorage.getItem(KEY))||clone(initial)}catch(e){data=clone(initial)};
// Rename the existing envelope label without changing its ID or saved allocations.
if(Array.isArray(data.bills)){for(const bill of data.bills){if(bill.id==='ruth'){bill.name='Other';bill.amount=0;bill.perCheck=0;bill.active=false;bill.notes='Inactive placeholder; no current payday allocation';}}}
if(!Array.isArray(data.reviews))data.reviews=[];
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Could not save locally. Please export a backup.')}if(cloudReady&&cloudUser){cloudDirty=true;cloudNeedsSave=true;setCloudStatus('Changes pending cloud sync…');clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(saveCloudLedger,500)}};

const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const today=()=>new Date().toISOString().slice(0,10);const monthKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;const paydayAnchor=new Date(2026,10,20,12);const todayLocal=new Date();const paydayOffset=Math.floor((Date.UTC(todayLocal.getFullYear(),todayLocal.getMonth(),todayLocal.getDate())-Date.UTC(2026,10,20))/(14*86400000));let selectedPayday=new Date(paydayAnchor);selectedPayday.setDate(selectedPayday.getDate()+14*paydayOffset);
const VIEW_KEY='little-ledger-view-v1';
const validTabs=['overview','bills','payday','activity','accounts'];
let tab='bills';
try{const view=JSON.parse(localStorage.getItem(VIEW_KEY)||'null');if(view&&validTabs.includes(view.tab))tab=view.tab;if(view&&/^\d{4}-\d{2}-\d{2}$/.test(view.payday||'')){const parts=view.payday.split('-').map(Number),saved=new Date(parts[0],parts[1]-1,parts[2],12);const days=(Date.UTC(parts[0],parts[1]-1,parts[2])-Date.UTC(2026,10,20))/86400000;if(saved.getFullYear()===parts[0]&&saved.getMonth()===parts[1]-1&&saved.getDate()===parts[2]&&Number.isInteger(days/14))selectedPayday=saved;}}catch(e){}
const saveView=()=>{try{localStorage.setItem(VIEW_KEY,JSON.stringify({tab,payday:[selectedPayday.getFullYear(),String(selectedPayday.getMonth()+1).padStart(2,'0'),String(selectedPayday.getDate()).padStart(2,'0')].join('-')}))}catch(e){}};
const paydayKey=()=>[selectedPayday.getFullYear(),String(selectedPayday.getMonth()+1).padStart(2,'0'),String(selectedPayday.getDate()).padStart(2,'0')].join('-');
const paydayLabel=()=>selectedPayday.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const reviewed=(billId,key=paydayKey())=>data.reviews.some(r=>r.billId===billId&&r.payPeriod===key);const account=id=>data.accounts.find(a=>a.id===id);const active=()=>data.bills.filter(b=>b.active);const funded=b=>Number(b.perCheck)||0;const totalPerCheck=()=>active().reduce((a,b)=>a+funded(b),0);const dueLabel=b=>b.dueDay?`Due ${ordinal(b.dueDay)}`:'No date set';function ordinal(n){return n+(n%100>=11&&n%100<=13?'th':n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th')}function balance(a){if(a.balance===null||a.balance===undefined||a.balance==='')return null;return Number(a.balance)+data.transactions.filter(t=>t.accountId===a.id).reduce((sum,t)=>sum+Number(t.amount),0)}const finished=()=>active().filter(b=>reviewed(b.id));const sumMonthly=()=>active().reduce((s,b)=>s+(Number(b.amount)||0),0);const displayMonth=()=>paydayLabel();const stat=(label,value,desc,cl='')=>`<div class="stat"><div class="muted small">${label}</div><div class="value ${cl}">${value}</div><div class="caption">${desc}</div></div>`;const icon=a=>esc(a?.icon||'🏦');const navigate=t=>{if(!validTabs.includes(t))return;tab=t;saveView();render();window.scrollTo({top:0,behavior:'smooth'})};
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('app').innerHTML=({overview:renderOverview,bills:renderBills,accounts:renderAccounts,payday:renderPayday,activity:renderActivity}[tab])();const x=document.getElementById('nextPayday');if(x){const anchor=new Date(2026,10,20,12),now=new Date();while(anchor<new Date(now.getFullYear(),now.getMonth(),now.getDate()))anchor.setDate(anchor.getDate()+14);x.textContent=anchor.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}}
function monthHeader(title,subtitle){return `<div class="hero"><div><div class="small" style="font-weight:800;letter-spacing:.11em;color:#668874">MY MONEY PLANNER</div><h2>${title}</h2><p>${subtitle}</p></div><div class="month"><button onclick="shiftMonth(-1)" aria-label="Previous paycheck">‹</button><strong>Paycheck: ${displayMonth()}</strong><button onclick="shiftMonth(1)" aria-label="Next paycheck">›</button></div></div>`}
function shiftMonth(d){selectedPayday.setDate(selectedPayday.getDate()+14*d);saveView();render()}
function renderOverview(){const checklist=active(),done=finished().length,acctBalances=data.accounts.map(balance),known=acctBalances.filter(v=>v!==null),total=known.reduce((s,v)=>s+v,0);return monthHeader('your money, at a glance ✨','Everything you need to check, all in one cozy place.')+`<div class="stats">${stat('Paycheck',money(data.paycheck),'Editable in Payday plan')}${stat('Set aside / paycheck',money(totalPerCheck()),'Your active recurring allocations')}${stat('Left after allocations',money(data.paycheck-totalPerCheck()),'Before any unlisted expenses',data.paycheck-totalPerCheck()<0?'negative':'positive')}${stat('Bills reviewed',`${done} / ${checklist.length}`,`For paycheck ${displayMonth()}`)}</div><div class="content-grid"><div><div class="panel"><div class="section-head"><h3>☑ Bill checklist</h3><button class="text-btn" onclick="navigate('bills')">View all →</button></div><div class="progress"><span style="width:${checklist.length?done/checklist.length*100:0}%"></span></div><p class="sub" style="margin:9px 0 13px">${done} of ${checklist.length} reviewed this paycheck</p>${checklist.filter(b=>!reviewed(b.id)).sort((a,b)=>(a.dueDay||99)-(b.dueDay||99)).slice(0,7).map(b=>billRow(b)).join('')||'<div class="empty">All done for this paycheck! 🌷</div>'}</div><div class="panel"><div class="section-head"><h3>🏦 Your accounts</h3><button class="text-btn" onclick="navigate('accounts')">View all →</button></div>${data.accounts.map(a=>`<div class="account-row"><div class="bubble">${icon(a)}</div><div class="grow"><div class="name">${esc(a.name)}</div><div class="sub">${esc(a.bank)}</div></div><div class="amount">${balance(a)===null?'—':money(balance(a))}</div></div>`).join('')}</div></div><div><div class="panel"><h3>🌼 Payday snapshot</h3><div class="small muted">Per paycheck • based on your allocations</div><div style="font-size:34px;font-weight:850;margin:8px 0">${money(data.paycheck-totalPerCheck())}</div><div class="sub">Not yet allocated</div><div class="progress" style="margin:18px 0"><span style="width:${Math.min(100,100*totalPerCheck()/Math.max(1,data.paycheck))}%"></span></div>${data.accounts.map(a=>{const v=active().filter(b=>b.accountId===a.id).reduce((s,b)=>s+funded(b),0);return v?`<div class="account-row"><span>${icon(a)}</span><div class="grow name">${esc(a.name)}</div><span class="amount">${money(v)}</span></div>`:''}).join('')}<button class="btn primary" style="margin-top:17px;width:100%" onclick="navigate('payday')">Open payday plan</button></div><div class="panel"><h3>💡 A little reminder</h3><p class="muted" style="margin:0">Balances are updated when you record payments, deposits, or transfers. This version doesn't connect to banks or send payments automatically.</p>${known.length?`<p class="small muted">${known.length} of ${data.accounts.length} balances entered • combined tracked balance: <strong>${money(total)}</strong></p>`:'<p class="small muted">Start by entering your current balances in Bank accounts.</p>'}</div></div></div>`}

${data.accounts.map(a=>{const bills=active().filter(b=>b.accountId===a.id),sum=bills.reduce((x,b)=>x+funded(b),0),tx=recordedTransfer(a.id);return bills.length?`<div class="payday-account" style="border-bottom:1px solid var(--line);padding:18px 0"><div class="payday-account-head"><div class="bubble">${icon(a)}</div><div class="grow"><div class="name">${esc(a.name)}</div><div class="sub">${esc(a.bank)} · ${bills.length} bill${bills.length===1?'':'s'}</div></div><div class="payday-account-amounts"><div><div class="small muted">Planned</div><div class="amount">${money(sum)}</div></div><div><div class="small muted">Actual</div><div class="amount ${tx?'positive':''}">${tx?money(Number(tx.amount)):'—'}</div></div></div>${tx?`<span class="pill paid" title="Recorded ${esc(tx.date)}">✓ Transferred</span>`:`<button class="tiny-btn" onclick="transfer(null,'${esc(a.id)}','${sum.toFixed(2)}',true)">Record</button>`}</div><div style="padding-left:8px">${bills.map(b=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)"><label for="payday_${esc(b.id)}" class="grow" style="min-width:0"><strong>${esc(b.name)}</strong><div class="small muted">${b.dueDay?'Due '+ordinal(b.dueDay):'Per-paycheck allocation'}</div></label><div style="display:flex;align-items:center;gap:6px"><span class="muted">$</span><input id="payday_${esc(b.id)}" type="number" inputmode="decimal" min="0" step="0.01" value="${funded(b).toFixed(2)}" aria-label="Amount to set aside for ${esc(b.name)} per paycheck" style="width:110px;max-width:28vw;padding:9px;border:1px solid var(--line);border-radius:10px;font:inherit;text-align:right;background:var(--paper);color:var(--ink)" onchange="updatePaydayBill('${esc(b.id)}',this.value)"></div></div>`).join('')}</div></div>`:''}).join('')}

function openModal(title,fields,onsubmit,extra=''){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><h2>${title}</h2><form id="modalForm">${fields}<div class="form-actions">${extra}<button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save</button></div></form></div></div>`;document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();onsubmit(new FormData(e.currentTarget))};const first=root.querySelector('input:not([type=hidden]), select');if(first)first.focus()}

`<p class="small-note">You can edit the nickname, bank, account type, icon, and notes without changing the linked bills or transaction history. Editing the tracked balance resets its starting point to match the number entered while preserving transaction history. Never enter routing numbers, full account numbers, or banking passwords.</p>`,
f=>{const newBal=f.get('balance')===''?null:Number(f.get('balance'));if(a){a.name=f.get('name');a.bank=f.get('bank');a.type=f.get('type');a.icon=f.get('icon');a.notes=f.get('notes');const effects=data.transactions.filter(t=>t.accountId===a.id).reduce((s,t)=>s+Number(t.amount),0);a.balance=newBal===null?null:newBal-effects}else data.accounts.push({id:id(),name:f.get('name'),bank:f.get('bank'),type:f.get('type'),icon:f.get('icon'),notes:f.get('notes'),balance:newBal});persist();closeModal();render()})}

function editBill(billId){const b=data.bills.find(b=>b.id===billId);openModal(b?'Edit bill or allocation':'Add bill or allocation',field('Name','name',b?.name||'','text','required')+selectField('Paid from account','accountId',data.accounts.map(a=>[a.id,`${a.name} (${a.bank})`]),b?.accountId)+`<div class="form-grid">${field('Monthly amount ($)','amount',b?.amount??'','number','min="0" step="0.01" required oninput="autoHalfPaycheck(this)"')}${field('Set aside each paycheck ($)','perCheck',b?.perCheck??'','number','min="0" step="0.01" required')}</div>`+field('Due day (1–31, optional)','dueDay',b?.dueDay??'','number','min="1" max="31"')+field('Notes','notes',b?.notes||'')+selectField('Status','active',[['yes','Active'],['no','Paused / canceled']],b?.active===false?'no':'yes'),f=>{const obj={id:b?.id||id(),name:f.get('name'),accountId:f.get('accountId'),amount:Number(f.get('amount')),perCheck:Number(f.get('perCheck')),dueDay:f.get('dueDay')?Number(f.get('dueDay')):null,notes:f.get('notes'),active:f.get('active')==='yes'};if(b)Object.assign(b,obj);else data.bills.push(obj);persist();closeModal();render()},b?`<button type="button" class="btn danger" style="margin-right:auto" onclick="deleteBill('${esc(b.id)}')">Delete</button>`:'')}

function authGate(message=''){showCloudGate('<h2>🌷 Your private Little Ledger</h2><p>Sign in to access the same bills, transfers, and paycheck history on all your devices.</p><form id="cloudAuthForm"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="cloud-buttons"><button class="btn primary" type="submit" value="signin">Sign in</button><button class="btn" id="signupBtn" type="button">Create account</button><button class="btn" id="resendConfirmBtn" type="button">Resend verification email</button></div><p class="cloud-error" id="authError">'+esc(message)+'</p></form><p class="small muted">Your bank passwords and account numbers are never needed. Your data is private to your login.</p>');document.getElementById('cloudAuthForm').onsubmit=async e=>{e.preventDefault();await submitAuth('signin')};document.getElementById('signupBtn').onclick=()=>submitAuth('signup');document.getElementById('resendConfirmBtn').onclick=resendVerificationEmail}
async function resendVerificationEmail(){const form=document.getElementById('cloudAuthForm'),email=form?.elements.email.value.trim(),status=document.getElementById('authError'),button=document.getElementById('resendConfirmBtn');if(!email||!form.elements.email.checkValidity()){status.textContent='Enter the email address used to create your account first.';form.elements.email.focus();return}if(!cloudClient){status.textContent='Could not connect to Supabase. Refresh and try again.';return}button.disabled=true;status.textContent='Requesting a new verification email…';try{const {error}=await cloudClient.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+location.pathname}});status.textContent=error?'Unable to resend: '+error.message:'If this email has a pending confirmation, a new verification link has been requested. Check your inbox and spam folder.'}catch(e){status.textContent='Unable to resend: '+(e?.message||'Please try again.')}finally{button.disabled=false}}
async function submitAuth(mode){if(!cloudClient)return authGate('Cloud connection library did not load. Check your internet connection and refresh.');const form=document.getElementById('cloudAuthForm'),email=form.elements.email.value.trim(),password=form.elements.password.value,err=document.getElementById('authError');if(!email||!password){err.textContent='Enter your email and password.';return}err.textContent='Working…';const result=mode==='signin'?await cloudClient.auth.signInWithPassword({email,password}):await cloudClient.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(result.error){err.textContent=result.error.message;return}if(!result.data.session){err.textContent='Check your email for a confirmation link, then return here and sign in.';return}await loadCloudLedger(result.data.session.user)}
function validLedger(x){return x&&Array.isArray(x.accounts)&&Array.isArray(x.bills)&&Array.isArray(x.payments)&&Array.isArray(x.transactions)&&typeof x.paycheck==='number'}
async function loadCloudLedger(user){if(!cloudClient)return;cloudReady=false;cloudUser=user;showCloudGate('<h2>🌷 Loading your ledger…</h2><p>Checking for your saved cloud data. Your local browser data is being kept safe.</p>');const {data:row,error}=await cloudClient.from('user_ledgers').select('ledger').eq('user_id',user.id).maybeSingle();if(error){showCloudGate('<h2>Unable to load cloud data</h2><p class="cloud-error">'+esc(error.message)+'</p><button class="btn" onclick="retryCloud()">Try again</button>');return}if(row){if(!validLedger(row.ledger)){showCloudGate('<h2>Cloud data needs attention</h2><p>The saved cloud record is not a valid Little Ledger backup. Nothing has been overwritten.</p><button class="btn" onclick="retryCloud()">Try again</button>');return}data=clone(row.ledger);if(!Array.isArray(data.reviews))data.reviews=[];try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}cloudReady=true;cloudDirty=false;cloudNeedsSave=false;showCloudApp()}else{firstCloudImportGate()}}
function firstCloudImportGate(){const hasLocal=!!localSnapshot;showCloudGate('<h2>🌷 First-time cloud setup</h2><p>No ledger has been saved in your Supabase account yet.</p><p>'+ (hasLocal?'You have Little Ledger data in this browser. <strong>Upload it to the cloud</strong> to keep your existing bill edits, reviews, and transfer history.':'This browser has no previously saved Little Ledger data. You can start with the starter categories and bills.')+'</p><p class="small muted">Before uploading, use the Backup data option in your original browser if you have not already done so.</p><div class="cloud-buttons">'+(hasLocal?'<button class="btn primary" id="cloudImportBtn">Use this browser’s data</button>':'<button class="btn primary" id="cloudImportBtn">Use generic example bills</button>')+'<button class="btn" id="cloudEmptyBtn">Start fresh</button><button class="btn" id="cloudLogoutBtn">Sign out</button></div>'+(hasLocal?'<div style="margin-top:12px"><button class="btn" id="cloudDownloadBtn">↓ Download browser backup</button></div>':'')+'<p class="cloud-error" id="cloudSetupError"></p>');document.getElementById('cloudImportBtn').onclick=()=>initializeCloud(hasLocal?clone(localSnapshot):clone(initial));document.getElementById('cloudEmptyBtn').onclick=()=>{if(confirm('Start an empty cloud ledger? This will not delete your original browser backup.'))initializeCloud({version:1,paycheck:0,accounts:[],bills:[],payments:[],reviews:[],transactions:[]})};if(hasLocal)document.getElementById('cloudDownloadBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'little-ledger',exportedAt:new Date().toISOString(),data:localSnapshot},null,2)],{type:'application/json'}),link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download='little-ledger-original-browser-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('cloudLogoutBtn').onclick=signOutCloud}
async function initializeCloud(ledger){const errorEl=document.getElementById('cloudSetupError');errorEl.textContent='Saving your first cloud ledger…';const {error}=await cloudClient.from('user_ledgers').insert({user_id:cloudUser.id,ledger});if(error){errorEl.textContent=error.message;return}data=ledger;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}cloudReady=true;cloudDirty=false;cloudNeedsSave=false;showCloudApp()}
async function saveCloudLedger(){if(!cloudReady||!cloudUser||!cloudNeedsSave||cloudSaving)return;cloudSaving=true;cloudNeedsSave=false;const snapshot=clone(data),userId=cloudUser.id;setCloudStatus('Saving to cloud…');const {error}=await cloudClient.from('user_ledgers').update({ledger:snapshot,updated_at:new Date().toISOString()}).eq('user_id',userId);cloudSaving=false;if(error){cloudNeedsSave=true;cloudDirty=true;setCloudStatus('⚠ Cloud save failed — '+error.message+' · Local backup retained');return}if(cloudNeedsSave){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(saveCloudLedger,100)}else{cloudDirty=false;setCloudStatus('✓ Saved to cloud · '+(cloudUser?.email||''))}}
async function signOutCloud(){if(cloudDirty||cloudSaving){alert('Cloud changes may still be pending. Check the sync status before signing out.');return}cloudReady=false;cloudUser=null;await cloudClient.auth.signOut();authGate()}
async function retryCloud(){const {data:sessionData}=await cloudClient.auth.getSession();if(sessionData.session)await loadCloudLedger(sessionData.session.user);else authGate()}
async function initializeAuth(){if(!cloudClient){showCloudGate('<h2>Cloud connection unavailable</h2><p>Could not load the Supabase library. Check network access, disable blocking extensions if needed, and refresh. Your browser data has not been changed.</p>');return}const {data:sessionData,error}=await cloudClient.auth.getSession();if(error){authGate(error.message);return}if(sessionData.session)await loadCloudLedger(sessionData.session.user);else authGate()}
document.getElementById('signOutBtn').onclick=signOutCloud;

document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)navigate(b.dataset.tab)});document.getElementById('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'little-ledger',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`little-ledger-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text()),d=obj.data||obj;if(!Array.isArray(d.accounts)||!Array.isArray(d.bills)||!Array.isArray(d.payments)||!Array.isArray(d.transactions)||typeof d.paycheck!=='number')throw Error('Not a Little Ledger backup');if(confirm('Replace your current ledger with this backup? If signed in, this will also overwrite the cloud ledger.')){data=d;if(!Array.isArray(data.reviews))data.reviews=[];persist();render();alert('Backup restored. Check the cloud sync status before leaving this page.')}}catch(err){alert('Could not restore: '+err.message)}e.target.value=''};localSnapshot=localStorage.getItem(KEY)?clone(data):null;initializeAuth();
</script></body></html>
